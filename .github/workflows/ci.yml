name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # macOS at the same Swift release as Linux and Windows: the xcode-27 image (a preview of GitHub's) with Xcode 27.2,
  # whose Swift is 6.4.2; the step after checkout stops the job if it is not
  test:
    name: build, test, gpconf (macOS, Swift 6.4.2)
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          swift --version 2>&1 | head -1 | grep -q "Swift version 6\.4\.2 " || { echo "not Swift 6.4.2" >&2; exit 1; }

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: The core without Foundation
        run: sh tools/check-no-foundation.sh

      - name: The core where Int is 32 bits
        run: sh tools/check-32-bit.sh

      - name: The documentation and its tutorials, in DocC
        run: sh tools/check-docs.sh

      - name: The example projects
        run: sh tools/check-examples.sh

      # gpconf runs offline here. It is never fetched for in CI: a hosted runner's address is shared, and the
      # corpus asks that its fetch not run in a loop or in CI. The cases that run from files shipped with the
      # corpus are exercised; the ones that need provider files report not-fetched, which the check expects.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gpconf
        run: python -m pip install gpconf==0.8.0

      - name: gpconf, offline
        run: |
          adapter="$PWD/.build/debug/gpkit-gpconf"
          status=0
          gpconf run --no-fetch-hint \
            --cmd "'$adapter' parse {fmt}" \
            --vectors-cmd "'$adapter' vectors" \
            --write-cmd "'$adapter' write" \
            --json gpconf-report.json || status=$?
          # 0: no case failed. 1: a case failed, and the check below names it. Anything else: nothing could run.
          if [ "$status" -gt 1 ]; then exit "$status"; fi

      - name: The bar
        run: python tools/check_gpconf.py gpconf-report.json

  # Linux, on the official Swift image at a pinned release: the same steps as on macOS.
  linux:
    name: build, test, gpconf (ubuntu-latest, Swift 6.4.2)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      # the whole history and its tags: the interface check compares with the latest 1.x release
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: The core without Foundation
        run: sh tools/check-no-foundation.sh

      - name: The example projects (the command-line ones)
        run: sh tools/check-examples.sh

      # the batch checked against one propagator at a time on 10,000 made-up sets; the times are not kept
      - name: The propagation benchmark, once
        run: swift run -c release --package-path tools/benchmark benchmark --runs 1

      - name: Python for gpconf
        run: apt-get update -q && apt-get install -y -q python3 python3-venv

      # a named OEM reader, the oem package for Python at a pinned version, reads what gpkit oem writes
      - name: A CCSDS OEM read back by the oem package
        run: |
          python3 -m venv "$RUNNER_TEMP/oem"
          "$RUNNER_TEMP/oem/bin/pip" install -q oem==0.4.5
          "$RUNNER_TEMP/oem/bin/python" tools/check_oem.py "$(swift build --show-bin-path)/gpkit"

      # Hamlib's own rotator programs, its dummy rotator following a pass that gpkit rotator gives
      - name: Hamlib's dummy rotator follows a pass
        run: |
          apt-get install -y -q libhamlib-utils
          sh tools/check-rotator.sh "$(swift build --show-bin-path)/gpkit"

      # here, at a pinned release, so that the interface is stated the same way on every run
      - name: The public interface, the changelog and 1.x
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in 0000000000000000000000000000000000000000) base= ;; esac
          sh tools/public-api.sh --check $base

      - name: Install gpconf
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/python" -m pip install gpconf==0.8.0

      # offline, as on macOS: the cases that need provider files report not-fetched, which the check expects
      - name: gpconf, offline
        run: |
          adapter="$PWD/.build/debug/gpkit-gpconf"
          status=0
          "$RUNNER_TEMP/venv/bin/gpconf" run --no-fetch-hint \
            --cmd "'$adapter' parse {fmt}" \
            --vectors-cmd "'$adapter' vectors" \
            --write-cmd "'$adapter' write" \
            --json gpconf-report.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi

      - name: The bar
        run: '"$RUNNER_TEMP/venv/bin/python" tools/check_gpconf.py gpconf-report.json'

  # WebAssembly (WASI), with swift.org's Wasm SDK for the pinned release, its checksum the one swift.org lists for
  # 6.4.2: the package built and its tests run.
  wasm:
    name: build, test (WebAssembly, Swift 6.4.2)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: The Wasm SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
          swift sdk list

      - name: Build
        run: swift build --swift-sdk swift-6.4.2-RELEASE_wasm

      - name: Unit tests
        run: swift test --swift-sdk swift-6.4.2-RELEASE_wasm

  # The playground's module (gpkit.gppasses.com, GPKit 2.0-b): GPKit built for WebAssembly as a WASI reactor, its
  # exports read back, and its size said against the plan's budget (at most 1.0 MB as sent, brotli). The size is
  # measured here and not on a developer's machine (the owner, 2026-11-09). Nothing fails on size yet: the first
  # numbers go to the owner before a budget is held.
  playground:
    name: playground module (WebAssembly, Swift 6.4.2)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: The Wasm SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5

      - name: Build
        run: swift build --package-path playground --swift-sdk swift-6.4.2-RELEASE_wasm -c release

      - name: Tools to measure with
        run: apt-get update -qq && apt-get install -y -qq brotli binaryen > /dev/null

      - name: Exports and size
        run: |
          bin=$(swift build --package-path playground --swift-sdk swift-6.4.2-RELEASE_wasm -c release --show-bin-path)
          wasm=$(find "$bin" -maxdepth 1 -type f \( -name 'GPKitPlayground.wasm' -o -name 'GPKitPlayground' \) | head -1)
          if [ -z "$wasm" ]; then echo "no module in $bin:" >&2; ls -la "$bin" >&2; exit 1; fi
          echo "the module: $wasm"
          for name in gpkit_alloc gpkit_free gpkit_answer gpkit_read gpkit_now gpkit_passes _initialize; do
            wasm-dis "$wasm" | grep -q "(export \"$name\"" || { echo "the module does not export $name" >&2; exit 1; }
          done
          # the shipped module: --strip-all at the link (the manifest), then wasm-opt -Oz --converge; the
          # budget is 1.1 MiB as sent, brotli (the owner's ruling of 2026-11-10; 600 KB stays the aim): above it, this fails
          wasm-opt -Oz --converge --enable-bulk-memory --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int "$wasm" -o gpkit-playground.wasm
          size() { printf '%-30s raw %9d  gzip -9 %9d  brotli -q 11 %9d\n' "$1" "$(wc -c < "$2")" "$(gzip -9c "$2" | wc -c)" "$(brotli -q 11 -c "$2" | wc -c)"; }
          size "as built" "$wasm" | tee size.txt
          size "wasm-opt -Oz --converge" gpkit-playground.wasm | tee -a size.txt
          sent=$(brotli -q 11 -c gpkit-playground.wasm | wc -c)
          budget=1153434
          echo "as sent: $sent bytes brotli; budget $budget (1.1 MiB), aim 614,400" | tee -a size.txt
          if [ "$sent" -gt "$budget" ]; then echo "the module is over its budget: $sent > $budget" >&2; exit 1; fi
          sha256sum gpkit-playground.wasm | tee -a size.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gpkit-playground
          path: |
            gpkit-playground.wasm
            size.txt

  # Windows, with swift.org's installer for the same pinned release: build and test.
  windows:
    name: build, test (windows-latest, Swift 6.4.2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Toolchain version
        run: swift --version

      # the native build system: Swift 6.4's default touches a test target's resource bundle on Windows with
      # `copy /b BUNDLE +,,`, which fails on a folder, once more than one test target has resources
      - name: Build
        run: swift build --build-system native

      - name: Unit tests
        run: swift test --build-system native

  # Android, with swift.org's Android SDK for the pinned release: the package built and its tests run in an emulator.
  android:
    name: build, test (Android, Swift 6.4.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, and test in an Android emulator
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          swift-version: 6.4.2
          free-disk-space: true
          # the native build system puts the tests' resources in GPKit_GPKitTests.resources, which the action
          # copies to the emulator; Swift 6.4's default names them otherwise
          swift-build-flags: --build-system native

  # The library alone, built for each Apple platform the package names besides macOS.
  platforms:
    name: build for ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Build
        run: xcodebuild build -scheme GPKit -destination "generic/platform=${{ matrix.platform }}" -derivedDataPath "$RUNNER_TEMP/derived"

  # The gpkit tool's release builds, standalone on each system (gpkit-binaries.yml).
  binaries:
    uses: ./.github/workflows/gpkit-binaries.yml

  # pygpkit, the Python package, as a wheel on each system, tested against GPKit's own answers (pygpkit-wheels.yml).
  pygpkit:
    uses: ./.github/workflows/pygpkit-wheels.yml
